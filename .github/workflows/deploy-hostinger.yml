name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    environment: REACT_APP_BASE_UR

    env:
      CI: false
      GENERATE_SOURCEMAP: false
      REACT_APP_BASE_URL: ${{ vars.REACT_APP_BASE_URL || secrets.REACT_APP_BASE_URL }}
      REACT_APP_RESUME_URL: ${{ vars.REACT_APP_RESUME_URL || secrets.REACT_APP_RESUME_URL }}
      REACT_APP_LINKEDIN_URL: ${{ vars.REACT_APP_LINKEDIN_URL || secrets.REACT_APP_LINKEDIN_URL }}
      REACT_APP_CDN_BASE_URL: ${{ vars.REACT_APP_CDN_BASE_URL || secrets.REACT_APP_CDN_BASE_URL }}
      REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY || secrets.REACT_APP_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN || secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID || secrets.REACT_APP_FIREBASE_PROJECT_ID }}
      REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET || secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID || secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID || secrets.REACT_APP_FIREBASE_APP_ID }}
      REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID || secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
      REACT_APP_S3_UPLOAD_ENDPOINT: ${{ vars.REACT_APP_S3_UPLOAD_ENDPOINT || secrets.REACT_APP_S3_UPLOAD_ENDPOINT }}
      REACT_APP_ADMIN_EMAILS: ${{ vars.REACT_APP_ADMIN_EMAILS || secrets.REACT_APP_ADMIN_EMAILS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate build environment
        shell: bash
        run: |
          required=(
            REACT_APP_CDN_BASE_URL
            REACT_APP_FIREBASE_API_KEY
            REACT_APP_FIREBASE_AUTH_DOMAIN
            REACT_APP_FIREBASE_PROJECT_ID
            REACT_APP_FIREBASE_STORAGE_BUCKET
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID
            REACT_APP_FIREBASE_APP_ID
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required build variables: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Build app
        run: npm run build

      - name: Deploy build to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          local-dir: ./build/
          server-dir: /
